name: Qualität

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen, Astro, Links und Alternativtexte prüfen
        run: npm run check

      - name: Statische Website bauen
        run: npm run build

      - name: Worker-Artefakt und lokale Auslieferung prüfen
        run: npm run worker:audit && npm run worker:smoke

      - name: Cloudflare-Paketierung trocken prüfen
        run: npm run worker:dry-run
